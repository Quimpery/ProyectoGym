<!--
  LAYOUT de la aplicación
  ------------------------------------------------------------
  - routerLink="/rutinas" navega SIN recargar la página (a diferencia de
    href, que recarga todo y pierde el estado de la app).
  - routerLinkActive="activo" le agrega la clase CSS "activo" al link
    cuando esa ruta es la actual: sirve para resaltar el menú.
-->
<header class="barra">
  <div class="contenedor barra-contenido">
    <a routerLink="/rutinas" class="marca">
      <!-- aria-hidden: el lector de pantalla ignora el emoji decorativo. -->
      <span aria-hidden="true">🏋️</span> Gym Rutinas
    </a>

    <!--
      [routerLinkActiveOptions]="{ exact: true }": "activo" solo si la URL es
      EXACTAMENTE esa. Sin esto, /rutinas/nueva también marcaría "Rutinas".
    -->
    <nav aria-label="Navegación principal">
      <a routerLink="/rutinas" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Rutinas</a>
      <a routerLink="/rutinas/nueva" routerLinkActive="activo">Nueva rutina</a>
    </nav>
  </div>
</header>

<main class="contenedor">
  <!-- Acá el router dibuja el componente que corresponde a la URL actual. -->
  <router-outlet />
</main>

<!-- Avisos de éxito/error. Está fuera del <main> para verse en todas las páginas. -->
<app-mensajes />
